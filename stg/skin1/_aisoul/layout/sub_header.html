<!--@css(/_aisoul/layout/layout.css)-->
<header class="header sub-header" data-ez="module-0o84y8t-1">
    <div class="inner-m header-inner">
        <div class="h-left">
            
            <!-- 사이드바 메뉴 -> displaynone 처리 -->
            <button type="button" class="menu-btn displaynone"><!--@import(/_aisoul/svg/menu.html)--><i class="sr-only">메뉴열기</i></button>
            
            <!-- 뒤로가기 -->
            <span module="Layout_MobileAction" class="back-wrap">
                <a href="#none" onclick="{$go_back}" class="back-btn"><i
                        class="sr-only">뒤로가기</i><!--@import(/svg/icon-go-back.html)--></a>
            </span>
            
            <!-- 장바구니 -->
            <div class="cart-wrap" module="Layout_shoppingInfo"><a href="/order/basket.html"><!--@import(/_aisoul/svg/cart.html)--><i class="sr-only">장바구니</i><strong>{$basket_cnt}<span class="{$use_basket_price|display}">({$basket_price})</span></strong></a>
            </div>
        </div>

        <h1 class="title"></h1>
        <div class="h-right">
            <button type="button" class="main-close"><!--@import(/_aisoul/svg/close.html)--><i class="sr-only">닫기</i></button>
        </div>
    </div>
</header>

<!-- sidebar -->
<div class="sidebar-viewport"><!--@import(/_aisoul/layout/sidebar.html)--></div>
<div class="sidebar-dim"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        'use strict';
        var $titleEl = document.querySelector('.title');
        var $source = document.querySelector('.page-title-source');
        if (!$titleEl || !$source) { return; }

        var titleText = $source.textContent.trim();
        var linkHref = $source.getAttribute('data-href');

        if (linkHref) {
            var $a = document.createElement('a');
            $a.href = linkHref;
            $a.textContent = titleText;
            $titleEl.innerHTML = '';
            $titleEl.appendChild($a);
        } else {
            $titleEl.textContent = titleText;
        }
    });
</script>
