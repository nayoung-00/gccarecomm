<style>
    html.gc-sso-auto-login body {
        visibility: hidden !important;
    }
</style>

<script>
    (function (window, document) {
        'use strict';

        try {
            if (new URL(window.location.href).searchParams.get('gc_sso_auto') === '1') {
                document.documentElement.classList.add('gc-sso-auto-login');
                window.gcSsoAutoLoginRevealTimer = window.setTimeout(function () {
                    document.documentElement.classList.remove('gc-sso-auto-login');
                }, 10000);
            }
        } catch (error) {
            document.documentElement.classList.remove('gc-sso-auto-login');
        }

        // Bridge 호출
        if (window.__gcLoginCommerceCloseInvoked) {
            return;
        }

        var isSsoAutoLogin = false;
        try {
            isSsoAutoLogin =
                new URL(window.location.href).searchParams.get('gc_sso_auto') === '1';
        } catch (ssoAutoCheckError) {}

        if (isSsoAutoLogin) {
            return;
        }

        try {
            if (
                window.android &&
                typeof window.android.webToAppCommerceClose === 'function'
            ) {
                window.__gcLoginCommerceCloseInvoked = true;
                window.android.webToAppCommerceClose(JSON.stringify({}));
                return;
            }

            var iosCommerceCloseHandler =
                window.webkit &&
                window.webkit.messageHandlers &&
                window.webkit.messageHandlers.webToAppCommerceClose;

            if (
                iosCommerceCloseHandler &&
                typeof iosCommerceCloseHandler.postMessage === 'function'
            ) {
                window.__gcLoginCommerceCloseInvoked = true;
                iosCommerceCloseHandler.postMessage({});
            }
        } catch (commerceCloseError) {
            console.error('[LOGIN][COMMERCE_CLOSE]', commerceCloseError);
        }

        // Bridge 호출 후 처리



    }(window, document));


    </script>
