<div class="section" module="Board_ListPackage_8">
    <!--@css(/css/module/board/listPackage_gallary.css)-->
    <div module="board_title_8">
    
        <!-- 동적 타이틀 (게시판) -->
        <span class="page-title-source" hidden>{$board_title}</span>
    </div>

	<div module="board_listheader_8" class="ec-base-tab gBlank7 {$list_type_display|display}">
		<ul>
			<li class="selected"><a href="/board/gallery/list.html{$param_list}"><!--@import(/svg/icon-sort-thumb.html)--> 이미지형</a></li>
			<li><a href="/board/gallery/list2.html{$param_list}"><!--@import(/svg/icon-sort-list.html)--> 리스트형</a></li>
		</ul>
	</div>

	<div class="boardSort board-promotion">
        <span module="board_category_8">{$form.board_category}</span>
    </div>
	<div class="boardList inner-m">
		<div module="board_list_8">
			<!--
				$count = 6
				$login_page_url = /member/login.html
				$deny_access_url = /index.html
			-->
			<ul class="promotion-list">
				<li class="{$block_target_class}" {$block_data_attr}>
					<a href="{$link_board_detail}">
						<span class="thumbnail"><img src="{$img_src}" onerror="this.src='//img.echosting.cafe24.com/thumb/198x198.gif'" alt="" /></span>
						<span class="summary">
							<strong class="subject {$block_content_class}">{$subject}<span class="comment">{$comment_count}</span></strong>
							<!-- <span>{$member_icon}{$writer} </span> -->
							<span class="date {$date_display|display}">{$write_date}</span>
						</span>
					</a>
					{$checkbox}
				</li>
				<li class="{$block_target_class}" {$block_data_attr}>
					<a href="{$link_board_detail}">
						<span class="thumbnail"><img src="{$img_src}" onerror="this.src='//img.echosting.cafe24.com/thumb/198x198.gif'" alt="" /></span>
						<span class="summary">
							<strong class="subject {$block_content_class}">{$subject}<span class="comment">{$comment_count}</span></strong>
							<!-- <span>{$member_icon}{$writer} </span> -->
							<span class="date {$date_display|display}">{$write_date}</span>
						</span>
					</a>
					{$checkbox}
				</li>
			</ul>
		</div>
		<div class="boardListEmpty {$empty_display|display}" module="board_empty_8">
			<p>{$empty_message}</p>
		</div>
	</div>


    <!-- 검색 -->
	<div module="board_search_8" class="inner-m">
		<!--@css(/css/module/board/search.css)-->
		<fieldset class="boardSearch">
			<legend>게시물 검색</legend>
			<div class="form">
                <div class="form-box"><input type="hidden" id="search_date" name="search_date" value="all"> {$form.search_key} {$form.search}</div>
                <a href="#none" class="btnNormal" onclick="{$action_search}">검색</a>
            </div>
		</fieldset>
	</div>
</div>
<!-- 글쓰기 -->
<div module="board_ButtonList_8" class="{$write_display|display} ec-base-button gBottom inner-m">
    <span class="gRight">
        <a href="/board/gallery/write.html{$param_write}" class="btnSubmitFix sizeM {$write_display|display} board-write-btn">글쓰기</a>
    </span>
</div>

<!-- 페이지 -->
<div module="board_paging_8" class="section ec-base-paginate typeList inner-m">
    <a href="{$param_prev}">이전 페이지</a>
    <ol>
        <li><a href="{$param_num}" class="{$param_class}">{$page_num}</a></li>
        <li><a href="{$param_num}" class="{$param_class}">{$page_num}</a></li>
    </ol>
    <a href="{$param_next}">다음 페이지</a>
</div>
