    <script>
    (function () {
        if (window.__markMainProdPriceRows) return;

        function specTitle(li) {
            var titleEl = li.querySelector(':scope > .title') || li;
            var text = '';
            titleEl.childNodes.forEach(function (node) {
                if (node.nodeType === 1 && (node.classList.contains('price-label') || node.classList.contains('list-coupon-label'))) return;
                text += node.textContent;
            });
            return text.replace(/[\s:]/g, '');
        }

        function markNode(node) {
            if (!node || node.nodeType !== 1) return;
            var rows = [];
            if (node.matches && node.matches('ul.spec > li')) rows.push(node);
            else if (node.querySelectorAll) {
                var found = node.querySelectorAll('ul.spec > li');
                for (var i = 0; i < found.length; i++) rows.push(found[i]);
            }
            for (var j = 0; j < rows.length; j++) {
                var title = specTitle(rows[j]);
                var kind = (title === '판매가' || title === '구매가') ? 'sale' : (title === '소비자가' ? 'consumer' : 'other');
                if (kind === 'consumer') rows[j].classList.add('consumer-li');
                if (rows[j].getAttribute('data-main-price-row') !== kind) rows[j].setAttribute('data-main-price-row', kind);
            }
        }

        window.__markMainProdPriceRows = function (root) {
            if (root) markNode(root);
        };

        var root = document.querySelector('.main-prod');
        if (!root || typeof MutationObserver === 'undefined') return;
        new MutationObserver(function (records) {
            for (var i = 0; i < records.length; i++) {
                var added = records[i].addedNodes;
                for (var n = 0; n < added.length; n++) markNode(added[n]);
            }
        }).observe(root, { childList: true, subtree: true });
    }());
    </script>
    <div class="inner-m">

                                <!--@import(/product/list_product.html)-->
                            </ul>
                            <script>
                            (function () {
                                var script = document.currentScript;
                                var list = script && script.previousElementSibling;
                                if (!list || !list.matches || !list.matches('ul.prdList')) {
                                    list = script && script.parentElement && script.parentElement.querySelector('ul.prdList');
                                }
                                try {
                                    if (window.__markMainProdPriceRows && list) {
                                        window.__markMainProdPriceRows(list);
                                        return;
                                    }
                                } catch (e) {}
                                if (!list) return;
                                var items = list.querySelectorAll('.prdList__item');
                                for (var i = 0; i < items.length; i++) items[i].classList.add('is-list-price-ready');
                            }());
                            </script>

    <script>
    (function () {
        var LIMIT = window.GC_OWNED_COUPON_RECOVERY_MS || 8000;
        if (window.__listPriceLoadingBooted) return;
        window.__listPriceLoadingBooted = true;
        window.__listPriceRecoveryMs = LIMIT;
        window.__listPriceLookupToken = 1;
        window.__listPriceLookupAborted = false;
        function items() {
            return document.querySelectorAll('.main-prod .prdList__item');
        }

        function reveal(reason) {
            if (window.__listPriceTimer) {
                window.clearTimeout(window.__listPriceTimer);
                window.__listPriceTimer = 0;
            }
            items().forEach(function (item) {
                item.classList.add('is-list-price-ready');
            });
            var root = document.querySelector('.main-prod');
            if (root) root.removeAttribute('aria-busy');
        }

        window.__releaseListPriceLoading = function () {
            reveal('');
        };
        window.__restartListPriceLoading = function () {
            window.__listPriceLookupAborted = false;
            window.__listPriceLookupToken = (window.__listPriceLookupToken || 1) + 1;
            items().forEach(function (item) {
                item.classList.remove('is-list-price-ready');
            });
            var root = document.querySelector('.main-prod');
            if (root) root.setAttribute('aria-busy', 'true');
            if (window.__listPriceTimer) window.clearTimeout(window.__listPriceTimer);
            window.__listPriceTimer = window.setTimeout(abort, LIMIT);
        };

        function abort() {
            window.__listPriceLookupAborted = true;
            window.__listPriceLookupToken = (window.__listPriceLookupToken || 1) + 1;
            reveal('복구 제한');
        }

        var root = document.querySelector('.main-prod');
        if (!root) return;
        root.setAttribute('aria-busy', 'true');
        window.__listPriceTimer = window.setTimeout(abort, LIMIT);
    }());
    </script>
