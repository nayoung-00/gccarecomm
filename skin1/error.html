<!--@layout(/layout/basic/layout.html)-->


<style>
    .sub-header .main-close,
    .sub-header .cart-wrap {
        display: none !important;
    }
</style>

<!-- 동적 타이틀 (헤더) -->
<span class="page-title-source" hidden>건강상품</span>

<div class="error-page" style="padding: 0 16px;">
    <div class="error-page__content" style="padding-top: 60px;text-align: center;">
        <h2 class="error-page__title" style="
                margin: 0 0 12px;
                font-size: 20px;
                font-weight: 700;
                line-height: 1.5;
                letter-spacing: -0.004em;
            ">
            앗, 문제가 발생했어요
        </h2>

        <p class="error-page__description" style="
                margin: 0 0 48px;
                color: #8a8a8a;
                font-size: 14px;
                font-weight: 500;
                line-height: 1.6;
            ">
            요청하신 페이지를 불러오지 못했어요.<br>
            잠시 후 다시 시도해 주세요.
        </p>

        <div class="error-btn-box" style="
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                width: 100%;
            ">
            <button type="button" class="error-page__button" onclick="location.reload();" style="
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    width: 100%;
                    height: 50px;
                    margin: 0;
                    padding: 0;
                    border: 1px solid #0ac262;
                    border-radius: 8px;
                    color: #000;
                    background: #fff;
                    font-size: 16px;
                    font-weight: 500;
                    font-family: inherit;
                    cursor: pointer;
                    box-sizing: border-box;
                ">
                다시 시도하기
            </button>

            <a href="/" class="error-page__home" style="
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    width: 100%;
                    height: 50px;
                    border-radius: 8px;
                    color: #fff;
                    background: #0ac262;
                    font-size: 16px;
                    font-weight: 500;
                    text-decoration: none;
                    box-sizing: border-box;
                ">
                홈으로 돌아가기
            </a>
        </div>
    </div>
</div>
