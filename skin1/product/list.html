    [data-owned-coupon-list] .prdList__item:not(.is-list-price-ready) ul.spec > li[data-owned-coupon-price-row="consumer"] { visibility:visible !important; }
    [data-owned-coupon-list] .prdList__item:not(.is-list-price-ready) ul.spec > li[data-owned-coupon-price-row="consumer"]::after { content:none !important; visibility:hidden !important; }
    [data-owned-coupon-list] .prdList__item:not(.is-list-price-ready) ul.spec > li[data-owned-coupon-price-row="sale"] { position:relative; visibility:hidden !important; min-height:14px; }
    [data-owned-coupon-list] .prdList__item:not(.is-list-price-ready) ul.spec > li[data-owned-coupon-price-row="sale"]::after { content:""; position:absolute; left:0; top:50%; z-index:1; width:132px; height:14px; visibility:visible !important; pointer-events:none; border-radius:4px; transform:translateY(-50%); background:linear-gradient(90deg, #f3f3f3 0%, #f3f3f3 32%, #e6e6e6 50%, #f3f3f3 68%, #f3f3f3 100%); background-size:220% 100%; animation:list-sale-skeleton-shimmer 1.8s ease-in-out infinite; }
    @keyframes list-sale-skeleton-shimmer { 0% { background-position:100% 0; } 100% { background-position:0 0; } }
    @media (prefers-reduced-motion: reduce) {
        [data-owned-coupon-list] .prdList__item:not(.is-list-price-ready) ul.spec > li[data-owned-coupon-price-row="sale"]::after { animation:none; }
    }
</style>
<script>
(function () {
    if (window.__armOwnedCouponListRecovery) return;
    window.__armOwnedCouponListRecovery = function (root) {
        if (!root || root.getAttribute('data-list-price-recovery') === '1') return;
        root.setAttribute('data-list-price-recovery', '1');
        var limit = window.GC_OWNED_COUPON_RECOVERY_MS || 8000;
        window.setTimeout(function () {
            if (typeof root.__releaseOwnedCouponPrices === 'function') return;
            var cards = root.querySelectorAll('.prdList__item');
            for (var i = 0; i < cards.length; i++) cards[i].classList.add('is-list-price-ready');
            root.removeAttribute('aria-busy');
        }, limit);
    };

    if (window.__bindListPriceRows) return;
    window.__bindListPriceRows = function (root) {
        if (!root || !root.hasAttribute('data-owned-coupon-list')) return;

        function specTitle(li) {
            var titleEl = li.querySelector(':scope > .title') || li;
            var text = '';
            titleEl.childNodes.forEach(function (node) {
                if (node.nodeType === 1 && (node.classList.contains('price-label') || node.classList.contains('list-coupon-label'))) return;
                text += node.textContent;
            });
            return text.replace(/[\s:]/g, '');
        }

        function markNode(node) {
            if (!node || node.nodeType !== 1 || !root.contains(node)) return;
            var rows = [];
            if (node.matches && node.matches('ul.spec > li')) rows.push(node);
            if (node.querySelectorAll) {
                var found = node.querySelectorAll('ul.spec > li');
                for (var i = 0; i < found.length; i++) rows.push(found[i]);
            }
            for (var j = 0; j < rows.length; j++) {
                var title = specTitle(rows[j]);
                var kind = title === '소비자가' ? 'consumer' : ((title === '판매가' || title === '구매가') ? 'sale' : '');
                if (!kind || rows[j].getAttribute('data-owned-coupon-price-row') === kind) continue;
                rows[j].setAttribute('data-owned-coupon-price-row', kind);
            }
        }

        if (root.getAttribute('data-list-price-bound') !== '1') {
            root.setAttribute('data-list-price-bound', '1');
            if (typeof MutationObserver !== 'undefined') {
                new MutationObserver(function (records) {
                    for (var i = 0; i < records.length; i++) {
                        var added = records[i].addedNodes;
                        for (var n = 0; n < added.length; n++) markNode(added[n]);
                    }
                }).observe(root, { childList: true, subtree: true });
            }
        }
        markNode(root);
    };
})();
</script>
