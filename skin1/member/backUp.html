
<!-- 로그인 -->
<div class="login">
    <label class="id ePlaceholder" title="{$login_id_type_text}">{$form.member_id}</label>
    <label class="password ePlaceholder" title="비밀번호">{$form.member_passwd}</label>
</div>
<div class="wrap_security">
    <p class="login__security">
        {$form.member_check_save_id}
        <span class="secret">
            <input type="checkbox" id="secur_check" checked disabled>
        </span>
        <label for="secur_check">보안접속</label>
    </p>
</div>
<!-- 비회원 구매 -->
<div class="login__button">
    <a href="#none" class="btnSubmit gFull sizeL" onclick="{$action_func_login}">로그인</a>
    <a href="{$returnUrl}" onclick="{$action_nomember_order}" class="btnNormal gFull sizeL {$display_nomember|display}">비회원 구매</a>
    <div class="{$display_nomember|display}">비회원의 경우, 해당버튼을 통해 주문이 가능합니다.</div>
</div>
<!-- 아이디 찾기 -->
<div class="wrap_find displaynone">
    <div><a href="/member/id/find_id.html">아이디 찾기</a></div>
    <div><a href="/member/passwd/find_passwd_info.html">비밀번호 찾기</a></div>
</div>
<!-- 회원가입 -->
<div class="login__util displaynone">
    <div>아직 회원이 아니신가요?</div>
    <div>지금 회원가입을 하시면<br>다양하고 특별한 혜택이 준비되어 있습니다.</div>
    <div><a href="/member/agreement.html">회원가입</a></div>
</div>





<!-- 비회원 주문조회 -->
<div module="MyShop_OrderHistoryNologin" id="order_history_nologin_id" class="displaynone">
    <!--@css(/css/module/myshop/orderHistoryNologin.css)-->
    <!--
        $orderDetailUrl = /myshop/order/list.html
    -->
    <div class="login">
        <div class="txt_nonmem_check">비회원 주문조회</div>
        <div class="txtInfo typeDot">비회원의 경우, 주문시의 주문번호로 주문조회가 가능합니다.</div>
        <div class="form">
            {$form.order_name}
            {$form.order_id}
            {$form.order_password}
            <div class="login__button">
                <button type="submit" class="btnSubmit gFull sizeL">확인</button>
            </div>
        </div>
    </div>
</div>
