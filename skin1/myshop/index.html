<style>
    .sub-header {display: none !important;}
    .section .xans-myshop-asyncbankbook {width: 100% !important; border: none !important; margin-left: 0 !important;}
    .xans-myshop-orderstate {margin-bottom: 18px;}
    .xans-myshop-asyncbankbook {margin-bottom: 30px;padding-top: 40px;border: none;}
    .xans-myshop-asyncbankbook ul {display: block;}
    .xans-myshop-asyncbankbook li {display: block !important;margin: unset;padding: 0 16px;text-align: left;}
    .xans-myshop-asyncbankbook .xans-myshop-asyncbenefit .user {display: block !important; padding: 0 !important;}
    .xans-myshop-asyncbankbook .xans-myshop-asyncbenefit .user .user__info {margin: 0; text-align: left !important;}
    .xans-myshop-asyncbankbook .xans-myshop-asyncbenefit .user .user__info .txtEm1 {font-size: 18px;font-weight: 700;color: #000;}
    .xans-myshop-asyncbankbook .xans-myshop-asyncbenefit .user .user__info .txtEm1 span {color: #0ac262;}

    .xans-myshop-orderstate .state__order {display: flex;align-items: center;justify-content: center;gap: 18px;padding: 20px;border-radius: 12px;text-align: center;background: #f7f7f7;}
    .xans-myshop-orderstate .state__order li {display: flex;align-items: center;gap: 18px;}
    .xans-myshop-orderstate .state__order .state-label-box {display: flex;flex-direction: column;gap: 10px;}
    .xans-myshop-orderstate .state .state__order li:not(:last-child)::after {content: '';display: block;width: 1px;height: 18px;background: #E6E6E6;}

    .xans-myshop-orderstate .state .count {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.5;
        color: #000;
    }
    .state__order .label {
        font-size: 12px;
        font-weight: 500;
        line-height: 1.5;
        color: #000;
    }

    .myshop-menu li a{padding: 12px 4px;font-size: 14px;font-weight: 500;line-height: 1.5;color: #000;}
    .myshop-logout a {padding: 12px 4px;font-size: 12px;font-weight: 500;line-height: 1.5; text-decoration: underline;color: #9b9b9b;}
</style>
