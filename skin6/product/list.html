<style>
    .sub-header {display: none !important;}
</style>

<!--@import(/_aisoul/layout/header.html)-->
<div class="section titleArea inner-m" module="product_headcategory" data-ez-module="product-list-head-title/1">
    <span class="likeButton {$disp_likecate_class}"><button type="button">{$disp_likecate_icon}<strong>{$disp_likecate_count}</strong></button></span>
</div>


<!-- 탭 -->
<!-- 상품 대분류 탭 -->
<div class="section category-tabs">
    <div class="swiper category-tab-swiper">
        <ul class="category-tabs__list swiper-wrapper"></ul>
    </div>
</div>

<!-- 상품 중분류 탭: 사용 시 주석 해제

    <div class="swiper category-sub-tab-swiper">
        <ul class="category-sub-tabs__list swiper-wrapper"></ul>
    </div>
</div>
-->



<!-- 추천 상품리스트 -->
<!-- <div module="product_headcategory" data-ez-module="product-list-categoryimage/1" class="section product_top_image">{$top_image1_tag}{$top_image2_tag}{$top_image3_tag}</div> -->
<div class="section inner-m" data-ez-module="product-listrecommend/1" data-ez-layout="grid2">
	<div data-ez-holder="product_list">
		<div module="product_listrecommend" class="ec-base-product">
			<!--@css(/css/module/product/listrecommend_swipe.css)-->
			<!--
				$count = 8
			-->

			<div class="listpage_title ez-align-left" data-ez-role="ez-align" data-ez-align="left">
				<div data-ez-role="title">Best Item</div>
				<span data-ez-role="subtitle">카테고리별 베스트 아이템</span>
			</div><!-- //listpage_title -->
			<ul class="prdList grid4" data-ez-role="layout ez-discount-tag">
				<!--@import(/product/list_product.html)-->
			</ul>
		</div>
	</div><!-- //product_list -->
</div>

<!-- 추천 상품리스트 2 -->
<div class="section inner-m" data-ez-module="product-listnew/1" data-ez-layout="grid2">
	<div data-ez-holder="product_list">
		<div module="product_listnew" class="ec-base-product">
			<!--@css(/css/module/product/listnew_swipe.css)-->
			<!--
				$count = 4
			-->
			<div class="listpage_title ez-align-left" data-ez-role="ez-align" data-ez-align="left">
				<div data-ez-role="title">New Arrival</div>
				<span data-ez-role="subtitle">카테고리별 새로운 아이템</span>
			</div><!-- //listpage_title -->
			<ul class="prdList grid4" data-ez-role="layout ez-discount-tag">
				<!--@import(/product/list_product.html)-->
			</ul>
		</div>
	</div><!-- //product_list -->
</div>


<!-- 상품리스트 -->
<div class="normalpackage_box section inner-m is-product-loading" data-ez-module="product-normalpackage/1">
	<!--@import(/product/shoppQ/searchContent.html)-->
	<div module="product_normalpackage" class="product_scrollx">
		<!--@css(/css/module/product/listnormal.css)-->
		<!--@js(/js/module/product/normalmenu.js)-->
		<div module="product_normalmenu">
			<!--
				$compare_page = /product/compare.html
			-->
			<div class="function" id="{$listmenu_position}">
				<p class="prdCount"><strong class="txtEm">{$total_count}</strong>개의 제품</p>
				<!-- <div class="sort">
					<select id="selArray" name="selArray" module="product_Orderby">
						<option value>- 정렬방식 -</option>
						<option value="{$param}">{$sort_name}</option>
						<option value="{$param}">{$sort_name}</option>
					</select>
				</div> -->
			</div>

			<fieldset class="condition {$select_search_display|display}">
				<legend>조건별 검색</legend>
				<p>
					<!--@js(/js/module/product/product_selectsearch.js)-->
					<select class="FirstSelect" module="product_FirstSelect">
						<option value>-조건선택-</option>
						<option value="{$value}" {$selected}>{$title}</option>
						<option value="{$value}" {$selected}>{$title}</option>
					</select>
					<select class="SecondSelect" module="product_SecondSelect">
						<option value>-조건선택-</option>
						<option value="{$value}" {$selected}>{$title}</option>
						<option value="{$value}" {$selected}>{$title}</option>
					</select>
					<a href="#SelectSearch" class="btnSubmitFix">검색</a>
				</p>
			</fieldset>
		</div>
		<div data-ez-holder="product_list">
			<div module="product_listnormal" class="ec-base-product">
				<!--
					$count = 8
					※ 상품진열갯수를 설정하는 변수입니다. 설정하지 않을 경우, 최대 200개의 상품이 진열 됩니다.
					※ 진열된 상품이 많으면, 쇼핑몰에 부하가 발생할 수 있습니다.
					$moreview = yes
					$cache = yes
					$basket_result = /product/add_basket.html
					$basket_option = /product/basket_option.html
				-->
				<ul class="prdList grid2" data-ez-role="layout ez-discount-tag">
					<!--@import(/product/list_product.html)-->
				</ul>
			</div>

			<div module="product_listmore" class="more">
				<a href="#none" onclick="{$more_action}" class="btnMore more-btn-comm">
					더보기<span class="prod-page-num"><span id="more_current_page">{$current_page}</span>/<span id="more_total_page">{$total_page}</span></span>
				</a>
			</div>

			<div module="product_normalpaging" class="ec-base-paginate typeList displaynone">
				<!-- <a href="{$param_first}" class="first">첫 페이지</a> -->
				<a href="{$param_prev}" class="paging-btn paging-prev-button"><i class="sr-only">이전 페이지</i><!--@import(/_aisoul/svg/arrow_bt.html)--></a>
				<ol>
					<li><a href="{$param}" class="{$param_class}">{$no}</a></li>
					<li><a href="{$param}" class="{$param_class}">{$no}</a></li>
					<li><a href="{$param}" class="{$param_class}">{$no}</a></li>
					<li><a href="{$param}" class="{$param_class}">{$no}</a></li>
					<li><a href="{$param}" class="{$param_class}">{$no}</a></li>
				</ol>
				<a href="{$param_next}" class="paging-btn paging-next-button"><i class="sr-only">다음 페이지</i><!--@import(/_aisoul/svg/arrow_bt.html)--></a>
				<!-- <a href="{$param_last}" class="last">마지막 페이지</a> -->
			</div>
		</div><!-- //product_list -->
	</div><!-- //product_normalpackage -->
</div>
